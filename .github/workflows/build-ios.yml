name: Build iOS IPA

# 手动点一下就跑；以后改了内容 push 也会自动跑
on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  SDK_SHA256: 062371d9e9ab24348bbb7cca89cd7c0f2715c3d2e8c3779157f7755287e23c1d

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- #
      #  ★ 关键：GitHub 的 macOS runner 只剩 2~4 GB 可用空间，
      #    解压 307MB 的 SDK 时会报 "write error (disk full?)" 然后挂掉。
      #    先把用不到的东西（模拟器运行时占了 6~10 GB）清掉。
      # ---------------------------------------------------------------- #
      - name: 清理磁盘
        run: |
          echo "==== 清理前 ===="
          df -h /
          XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          echo "Xcode: $XCODE"
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf "$XCODE/Contents/Developer/Platforms/WatchOS.platform" 2>/dev/null || true
          sudo rm -rf "$XCODE/Contents/Developer/Platforms/AppleTVOS.platform" 2>/dev/null || true
          sudo rm -rf "$XCODE/Contents/Developer/Platforms/WatchSimulator.platform" 2>/dev/null || true
          sudo rm -rf "$XCODE/Contents/Developer/Platforms/AppleTVSimulator.platform" 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData/* 2>/dev/null || true
          rm -rf ~/.cocoapods 2>/dev/null || true
          echo "==== 清理后 ===="
          df -h /

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          echo "---- 仓库内容 ----"
          ls -lh

      - name: 装 CocoaPods
        run: |
          pod --version || (gem install cocoapods --no-document && pod --version)

      - name: 合并分卷 + 修文件名 + 解压
        run: |
          set -e
          echo "---- 分卷 ----"
          ls -lh slim-sdk.zip.part*
          cat slim-sdk.zip.part* > slim-sdk.zip
          echo "---- 合并后 ----"
          ls -lh slim-sdk.zip

          echo "---- 校验 sha256 ----"
          ACTUAL=$(shasum -a 256 slim-sdk.zip | awk '{print $1}')
          echo "期望: $SDK_SHA256"
          echo "实际: $ACTUAL"
          if [ "$SDK_SHA256" != "$ACTUAL" ]; then
            echo "❌ 分卷合并后校验失败 —— 有分卷没传全或者传坏了"
            exit 1
          fi

          # ---------------------------------------------------------- #
          #  SDK 里有个中文名的 .md（uni-app本地Pod模块使用说明.md），
          #  zip 里存的是 GBK 编码的文件名，macOS 解压时会报
          #  "write error (disk full?)" 然后 exit 50 —— 其实是文件名非法。
          #  这文件对编译毫无用处，重写 zip 时直接跳过非 ASCII 名字。
          # ---------------------------------------------------------- #
          echo "---- 过滤掉非 ASCII 文件名 ----"
          python3 - <<'PYEOF'
          import zipfile, os, shutil
          src = 'slim-sdk.zip'
          dst = 'slim-clean.zip'
          skipped = 0
          kept = 0
          with zipfile.ZipFile(src) as zi, \
               zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED, allowZip64=True) as zo:
              for i in zi.infolist():
                  try:
                      i.filename.encode('ascii')
                  except UnicodeEncodeError:
                      print('  跳过:', i.filename)
                      skipped += 1
                      continue
                  zo.writestr(i, zi.read(i.filename))
                  kept += 1
          print('  保留 %d 条，跳过 %d 条' % (kept, skipped))
          os.remove(src)
          shutil.move(dst, src)
          PYEOF

          echo "---- 解压 ----"
          mkdir -p workspace
          unzip -q -o slim-sdk.zip -d workspace
          echo "---- 结构 ----"
          ls -la workspace
          echo "---- HBuilder-Hello ----"
          ls workspace/SDK/HBuilder-Hello | head -30
          echo "---- www 文件数 ----"
          find workspace/SDK/HBuilder-Hello/HBuilder-Hello/Pandora/apps -type f | wc -l
          echo "---- 磁盘 ----"
          df -h /

          # 解压完就把压缩包删了，省 60 MB
          rm -f slim-sdk.zip slim-sdk.zip.part*

      # ---------------------------------------------------------------- #
      #  打包 slim-sdk 时只装了 HBuilder-Hello/ 和 SDK/ 两个目录，
      #  漏掉 SDK 根目录的 uniapp.podspec —— Podfile 里 `:path => '..'`
      #  指的就是它，缺了 CocoaPods 会报 "No podspec found for `uniapp`"。
      #  license.md 也是 podspec 里 license 字段引用的，同样必须有。
      #  这 4 个文件从仓库根目录拷过去补上。
      # ---------------------------------------------------------------- #
      - name: 补齐 SDK 根目录文件
        run: |
          set -e
          echo "---- 仓库根目录 ----"
          ls -la *.podspec *.md *.txt *.xls 2>/dev/null || true
          for f in uniapp.podspec license.md readme.txt Feature-iOS.xls; do
            if [ -f "$f" ]; then
              cp "$f" workspace/SDK/
              echo "  补上: $f"
            else
              echo "  ⚠ 缺: $f"
            fi
          done
          echo "---- workspace/SDK 根目录 ----"
          ls -la workspace/SDK/
          if [ ! -f workspace/SDK/uniapp.podspec ]; then
            echo "❌ uniapp.podspec 没补上，pod install 必挂"
            exit 1
          fi

      # ---------------------------------------------------------------- #
      #  新版 App 的 www：改界面/功能只要换这个 1MB 的包，
      #  不用重传 59.6MB 的 SDK 分卷。
      # ---------------------------------------------------------------- #
      - name: 覆盖 www（新版 App 产物）
        run: |
          set -e
          WWW="workspace/SDK/HBuilder-Hello/HBuilder-Hello/Pandora/apps/__UNI__9A5FF7C/www"
          if [ -f www.zip ]; then
            echo "---- 旧 www ----"
            find "$WWW" -type f 2>/dev/null | wc -l
            rm -rf "$WWW"
            mkdir -p "$WWW"
            rm -rf /tmp/www && mkdir -p /tmp/www
            unzip -oq www.zip -d /tmp/www
            cp -R /tmp/www/. "$WWW"/
            echo "---- 新 www ----"
            find "$WWW" -type f | wc -l
            ls "$WWW"
            echo "---- manifest 里的 id ----"
            grep -o '"id":"[^"]*"' "$WWW/manifest.json" || true
          else
            echo "⚠ 没有 www.zip，用 SDK 里自带的旧版"
          fi

      # ---------------------------------------------------------------- #
      #  换图标 + 把显示名/AppKey 再强制写一遍。
      #  slim-sdk 里其实已经是改好的，但保险起见编译前再砸一次，
      #  免得 Info.plist 被工程设置覆盖。
      # ---------------------------------------------------------------- #
      - name: 换图标 + 改显示名
        run: |
          set -e
          ICON_DIR="workspace/SDK/HBuilder-Hello/HBuilder/Images.xcassets/AppIcon.appiconset"
          LEGACY_DIR="workspace/SDK/HBuilder-Hello/HBuilder-Hello/icon"
          PLIST="workspace/SDK/HBuilder-Hello/HBuilder-Hello/HBuilder-Hello-Info.plist"

          if [ -f icons.zip ]; then
            rm -rf /tmp/icons && mkdir -p /tmp/icons
            unzip -oq icons.zip -d /tmp/icons
            echo "---- 图标包 ----"
            ls /tmp/icons/AppIcon.appiconset | head -20
            cp -f /tmp/icons/AppIcon.appiconset/* "$ICON_DIR"/
            echo "---- 换完后的 AppIcon ----"
            ls "$ICON_DIR" | head -22
            if [ -d "$LEGACY_DIR" ] && [ -d /tmp/icons/icon ]; then
              cp -f /tmp/icons/icon/* "$LEGACY_DIR"/
              echo "---- 启动图 icon/ 也换了 ----"
            fi
          else
            echo "没有 icons.zip，图标保持原样"
          fi

          # ---------------------------------------------------------- #
          #  ★ 名字不对的真凶：这两个本地化文件会覆盖 Info.plist 的
          #    CFBundleDisplayName。
          #      en.lproj/InfoPlist.strings      -> "HBuilder Hello"
          #      zh-Hans.lproj/InfoPlist.strings -> "HBuilder 你好"
          #    中文系统下桌面显示的就是「HBuilder 你好」。
          # ---------------------------------------------------------- #
          echo "---- 修 InfoPlist.strings（名字不对的真凶）----"
          for f in workspace/SDK/HBuilder-Hello/HBuilder-Hello/*.lproj/InfoPlist.strings; do
            [ -f "$f" ] || continue
            echo "  原内容: $(cat "$f" | tr '\n' ' ')"
            printf '/* Localized versions of Info.plist keys */\nCFBundleDisplayName="代理客户端";\n' > "$f"
            echo "  改成  : $(cat "$f" | tr '\n' ' ')"
          done

          echo "---- 强制改 Info.plist ----"
          python3 - <<'PYEOF'
          import plistlib
          p = 'workspace/SDK/HBuilder-Hello/HBuilder-Hello/HBuilder-Hello-Info.plist'
          with open(p, 'rb') as f:
              d = plistlib.load(f)
          d['CFBundleDisplayName'] = '代理客户端'
          d['CFBundleName'] = '代理客户端'
          d['dcloud_appkey'] = '5a09282097db5e4661daa29a4bdcd234'
          with open(p, 'wb') as f:
              plistlib.dump(d, f, fmt=plistlib.FMT_BINARY)
          print('  CFBundleDisplayName:', d['CFBundleDisplayName'])
          print('  CFBundleName       :', d['CFBundleName'])
          print('  dcloud_appkey      :', d['dcloud_appkey'])
          PYEOF

          echo "---- pbxproj 里的 BundleID / 版本 ----"
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION" \
            workspace/SDK/HBuilder-Hello/HBuilder-Hello.xcodeproj/project.pbxproj \
            | sed 's/^[[:space:]]*//' | sort -u

      - name: pod install
        working-directory: workspace/SDK/HBuilder-Hello
        run: |
          set -o pipefail
          pod install --repo-update > /tmp/pod.log 2>&1 || {
            echo "===== pod install 失败，最后 200 行 ====="
            tail -200 /tmp/pod.log
            exit 1
          }
          tail -30 /tmp/pod.log
          echo "---- 生成了什么 ----"
          ls -d *.xcworkspace *.xcodeproj Pods 2>/dev/null
          echo "---- 磁盘 ----"
          df -h /

      - name: 编译
        working-directory: workspace/SDK/HBuilder-Hello
        run: |
          set -o pipefail
          xcodebuild \
            -workspace HBuilder-Hello.xcworkspace \
            -scheme HBuilder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > /tmp/build.log 2>&1 || {
              echo "===== 编译失败，最后 250 行 ====="
              tail -250 /tmp/build.log
              exit 1
            }
          echo "===== 编译成功 ====="
          tail -20 /tmp/build.log
          ls -la build/App.xcarchive/Products/Applications/
          df -h /

      - name: 打成 IPA
        working-directory: workspace/SDK/HBuilder-Hello
        run: |
          set -e
          APP=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -1)
          echo "App: $APP"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../代理客户端.ipa Payload
          cd ..
          ls -lh 代理客户端.ipa
          echo "---- 内容抽查 ----"
          unzip -l 代理客户端.ipa | head -20

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: 代理客户端-ipa
          path: workspace/SDK/HBuilder-Hello/代理客户端.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 编译日志（失败时也有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/pod.log
            /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
